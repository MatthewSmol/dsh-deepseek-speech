- insert:
    - id: deepseek-speech
      name: "@local/dsh-deepseek-speech"
      config:
        apiKeyEnv: DEEPSEEK_API_KEY
        baseUrl: https://api.deepseek.com
        telegramHome: default
        historyLimit: 500
        asrChunkSeconds: 110
        asrMaxDurationSeconds: 600
        ffmpegPath: ""
        ffprobePath: ""
    - id: deepseek-speech-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: deepseek_speech
        transport: streamable-http
        url: http://127.0.0.1:3080/deepseek-speech/mcp
        failOnStartupError: false
        toolCallTimeoutMs: 180000
